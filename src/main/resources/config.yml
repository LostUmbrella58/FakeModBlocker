# Language file to use: messages_<language>.yml in this folder.
# Two are shipped and written out on first start: "en" (English) and "cn" (简体中文).
# Copy either one to messages_<your-language>.yml to add your own; edits survive updates,
# and any key you leave out falls back to the version bundled in the jar.
# 语言文件：本目录下的 messages_<language>.yml。
# 插件自带并在首次启动时释放两份：en（英文）与 cn（简体中文）。
# 想加别的语言就复制一份改名，缺失的条目会自动回退到插件内置的同名文件。
language: en

# Whether to activate mod detection
enable: true

# Whether to print logs to console
# Enabling this will show every mod and plugin messages (yes, it actually shows some plugin messages and player mod channeling messages) between your players and your server in console
# Notice: This would be helpful to show all mods that a server can get so that you can easily add more forbidden mods if you want.
logger: true

# Use custom kick command instead of default kick player
useCustomKickCommand: true

# Custom kick command if enabled (supports %player% and %kickMessage%)
command: "kick %player% %kickMessage%"

# =============================================================================
# forbiddenList — plugin-channel keywords (NOT mod display names)
# =============================================================================
# IMPORTANT: entries here are matched against the *plugin channels* a mod
# registers with the server, NOT the mod's user-facing name.
#
#   - "xaeroworldmap"    matches channel "xaeroworldmap:main" (prefix match)
#   - "servux:tweaks"    matches ONLY exact channel "servux:tweaks" (contains ':')
#
# Rule of thumb (see channelMatchesKeyword in source):
#   * keyword without ':' -> matches channel that equals keyword, OR starts with "keyword:"
#   * keyword with    ':' -> matches ONLY that exact channel
#
# Many popular client-only mods (movement cheats, HUD overlays, GUI clients like
# Meteor/Wurst/Impact, most utility mods) do NOT register any plugin channel.
# forbiddenList CANNOT catch those. To detect them you have two options:
#   1. Turn on `logger` below, join with the mod, and copy the channel it
#      prints in console (if any) into this list.
#   2. Use `extra-detections.sign-translation.mods` below and give it a
#      translation key from that mod's client-side language file. This is
#      the ONLY way to catch client-only mods that never open a channel.
#
# Adding a raw mod name like "meteorclient" or "sodium" here without knowing
# the real channel will just silently do nothing.
# =============================================================================
forbiddenList:
  - "fabric"
  - "forge"
  - "xaeroworldmap"
  - "xaerominimap"
  - "worldinfo"
  - "tweakeroo"
  - "creativecore"
  - "minimapsync"
  # Use specific Servux sub-channels so that "servux:litematics" (Litematica) is not caught.
  # Tweakeroo registers "servux:tweaks", MiniHUD/Structures registers "servux:structures".
  - "servux:tweaks"
  - "servux:structures"
  - "axiom"
  - "freecam"
  - "flashback"
  - "voxelmap"
  - "replay"

notifyStaff: true
notificationPermission: fakemodblocker.notify

# =============================================================================
# discord — optional notifications, routed through DiscordSRV
# =============================================================================
# OFF by default, and requires DiscordSRV to be installed. Nothing is bundled:
# the one class that talks to DiscordSRV is loaded only when this is enabled and
# DiscordSRV is present, exactly like the PacketEvents and sign-detection
# bridges. Without DiscordSRV this section does nothing at all.
#
# DiscordSRV owns the connection, the request queue and the rate limiting, so a
# slow Discord can never delay a player join.
#
# Verify with:  /modblocker discord test
#
# One detection is one message: when the escalation ladder handles a detection
# it posts the `escalation` message and the per-detection one is skipped.
# =============================================================================
# discord —— 可选通知，走 DiscordSRV
# =============================================================================
# 默认关闭，且需要服主已安装 DiscordSRV。本插件不打包任何东西：
# 唯一接触 DiscordSRV 的那个类，只有在这里启用且 DiscordSRV 存在时才会被加载，
# 跟 PacketEvents、告示牌检测那两个 bridge 是同一套做法。
# 没装 DiscordSRV 时，这一整段完全不起作用。
#
# 连接、请求队列和限流都由 DiscordSRV 负责，所以 Discord 再慢也不会拖慢玩家进服。
#
# 填好后用 /modblocker discord test 验证。
#
# 一次检测只发一条：阶梯处罚接管时只发 escalation 那条，单次检测那条会被跳过。
# =============================================================================
discord:
  enabled: false

  # Where to post. Three ways to write it:
  #   ""                     -> DiscordSRV's main channel
  #   "global"               -> a DiscordSRV game-channel name (mapping stays in DiscordSRV's config)
  #   "123456789012345678"   -> a raw Discord channel ID
  # 发到哪里，三种写法：
  #   ""                     -> DiscordSRV 的主频道
  #   "global"               -> DiscordSRV 的游戏频道名（映射关系仍由 DiscordSRV 自己的配置决定）
  #   "123456789012345678"   -> 直接填 Discord 频道 ID
  channel: ""

  # true  -> a coloured embed with Player / Mod / Action fields
  # false -> one plain line
  # true 为彩色 embed（带 玩家 / 模组 / 处理 字段），false 为纯文本单行。
  embed: true

  # Prepended to every message. "<@&ROLE_ID>" for a role, "<@USER_ID>" for a person.
  # Empty means nothing is ever pinged — and nothing in a message can ping on its own,
  # not even a literal @everyone that ended up in a mod name or a reason string.
  # 每条消息前缀。角色用 "<@&角色ID>"，个人用 "<@用户ID>"。
  # 留空则永不 @ 任何人；消息正文里就算出现 @everyone 也不会真的触发提醒。
  mention: ""

  # Shown as %server% in the templates. Empty = the server's own name.
  # 模板里的 %server%；留空则使用服务端自身的名称。
  server-name: ""

  # Which detections get posted. 哪些检测会推送。
  events:
    # A forbidden plugin channel was matched. 匹配到被禁止的插件频道。
    channel-detection: true
    # A sign-translation key came back translated. 告示牌翻译键检测命中。
    sign-detection: true
    # An escalation ladder rung was applied. 触发了阶梯处罚的某一级。
    escalation: true
    # The virtual sign check could never be completed. 虚拟告示牌检测始终无法完成。
    evade: true

  # Also post detections whose action is IGNORE (count and log only, punish nothing).
  # 是否推送 action 为 IGNORE 的检测（只计数记录、不处罚）。
  include-ignored: false

  # Embed colours, #RRGGBB. Only used when embed is true. 仅在 embed: true 时生效。
  colors:
    notice: "#E67E22"
    kick: "#E74C3C"
    ban: "#992D22"
    evade: "#F1C40F"
    test: "#2ECC71"

# =============================================================================
# escalation — optional warn -> kick -> ban "strike" system
# =============================================================================
# OFF by default. While `enabled: false` the plugin behaves exactly as before:
# every detection immediately applies its own fixed punishment.
#
# When enabled, a detection no longer punishes directly. Instead the plugin
# counts violations per player and applies the matching rung of `ladder`:
#   1st time joining with Freecam  -> warned + kicked
#   2nd time joining with Freecam  -> permanently banned
#
# Counts are stored in plugins/FakeModBlocker/violations.yml and survive
# restarts. Inspect and reset them with:
#   /modblocker violations <player>
#   /modblocker clear <player> [mod]
#
# What escalation takes over:
#   * every forbiddenList (plugin channel) detection
#   * sign-translation mods whose action is KICK or BAN
# What it never touches:
#   * sign-translation mods with action NOTICE or IGNORE — those stay
#     observational, so turning this on cannot turn a "watch only" mod into a ban
#   * a mod with `punishment.escalation: false`, which keeps its fixed action
# =============================================================================
escalation:
  enabled: false

  # true  -> each mod has its own strike counter (Freecam strikes are separate from Xaero strikes)
  # false -> one shared counter per player, no matter which mod was found
  per-mod: true

  # Count at most one strike per mod per session. Keep this true: a single join is
  # often seen by several detectors (packet channel + join scan + sign check), and
  # without it one join could jump several rungs at once.
  count-once-per-session: true

  # Forget a counter if the player has not triggered it for this long.
  # Forms: 30d, 12h, 90m, 45s, 2w, or compounds like 1d12h. Use 0 or "never" to keep forever.
  reset-after: "30d"

  # Hand bans to another plugin (LiteBans, AdvancedBan, CMI, ...) instead of the
  # vanilla ban list. The external plugin is then responsible for kicking the player.
  use-custom-ban-command: false
  ban-command: "ban %player% %reason%"
  temp-ban-command: "tempban %player% %duration% %reason%"

  # The ladder. `violations` is the strike count this rung starts at; the last rung
  # keeps applying to every further violation.
  #
  # action:
  #   WARN    - send the message, player stays online
  #   KICK    - send the message as the kick reason (honours useCustomKickCommand)
  #   BAN     - ban for `duration` (empty / 0 / "permanent" = permanent), then kick
  #   COMMAND - run `command` from console
  #   IGNORE  - only count and log, punish nothing
  #
  # Without a `message`, a rung uses escalation.warn / escalation.kick / escalation.ban
  # from your messages_<language>.yml, so it follows the server language automatically.
  # Add `message` only when you want to override that text for one rung:
  #
  #   message placeholders:
  #     %player% %mod% %count% %step% %steps% %next% %duration% %reason% %source% %action%
  #     (%mod% = detected mod/channel, %count% = this player's violation number,
  #      %next% = the violation count of the following rung, %reason% = the mod's
  #      own configured reason from sign-translation, if any)
  ladder:
    - violations: 1
      action: KICK
      # message: |-
      #   &c&lWarning &7(strike %count%)
      #   &fYou joined with &c%mod%&f, which is not allowed on this server.
      #   &7Remove it before rejoining - joining again with it will get you &c&lpermanently banned&7.
    - violations: 2
      action: BAN
      duration: ""

  # Softer four-rung example - replace the ladder above with this to warn twice first:
  #  ladder:
  #    - violations: 1
  #      action: WARN
  #    - violations: 2
  #      action: KICK
  #    - violations: 3
  #      action: BAN
  #      duration: "7d"
  #    - violations: 4
  #      action: BAN
  #      duration: ""

# Extra optional detections
# WARNING:
# This sign translation detection depends on sign editor API availability.
# On some older server versions/APIs it is NOT available and will be skipped automatically.
extra-detections:
  # Optional: use PacketEvents (https://www.spigotmc.org/resources/packetevents-api.80279/)
  # to intercept plugin-channel registration packets directly. This catches forbidden
  # channels earlier (no PlayerJoinEvent + 15 tick delay) and is more reliable when mods
  # register channels late in the session. Only takes effect if PacketEvents is installed.
  packet-events:
    enabled: true
  # -------------------------------------------------------------------------
  # sign-translation — the "translation-key" side-channel detector
  # -------------------------------------------------------------------------
  # How it works (short version):
  #   The plugin opens a virtual sign to the joining player, whose lines
  #   contain Component.translatable(<key>). If the player's client resolves
  #   the key to something other than the raw key string, that client has
  #   the mod which owns that key loaded -> hit.
  #
  # detect.key can be:
  #   - a single string:   key: "key.freecam.toggle"
  #   - a list of strings: keys: ["key.mymod.a", "key.mymod.b"]
  #                        (any one translated -> mod is flagged; useful for
  #                         mods with several keybinds, or when different mod
  #                         versions use different key names)
  #
  # Requires Paper 1.21.5+ (Player#openVirtualSign was added in 1.21.5 —
  # it does NOT exist on any 1.21.4 build, and never will). Spigot and some
  # Paper forks (Purpur / Pufferfish / Leaves) may also lack it depending on
  # how closely they track upstream Paper. If the API is missing, the
  # feature auto-disables at startup and console prints the exact class or
  # method that could not be resolved.
  # -------------------------------------------------------------------------
  sign-translation:
    enabled: true
    skip-bedrock-via-floodgate: true

    # Opening the detection sign is setScreen() on the client, so it replaces whatever the
    # player is looking at. If that is a resource pack confirmation the player never gets to
    # answer it and silently never receives the pack; dialogs and other plugins' menus are
    # lost the same way. With this on, the check waits for the screen to clear instead.
    #
    # The wait has no deadline on purpose: a deadline would mean "hold a GUI open long enough
    # and you are never checked". The player has to close it to play, and the check resumes
    # the moment they do.
    #
    # Bukkit only reports container menus. Install PacketEvents (optional) and dialogs,
    # resource pack prompts and books become visible too - and a player turning their camera
    # is used to notice they closed a dialog with ESC, which sends nothing back.
    avoid-open-screens: true

    # How many rounds to open the sign when the client never answers
    # (backoff 10s / 30s / 60s / 120s). A round where the client answered at least one page
    # counts as done. Running out means the check could not be completed.
    max-attempts: 4

    # Report once when a player has kept a screen open for this many seconds and the check
    # still cannot start. Reporting does not stop the waiting.
    evade-timeout-seconds: 300

    # What to do about a check that could never be completed: NOTICE (tell staff) or KICK.
    # NOTICE by default - a stuck resource pack prompt, a slow client or a bad connection all
    # land here, and kicking for those costs more than this symbolic check is worth.
    evade-action: NOTICE

    mods:
      Freecam:
        detect:
          key: "key.freecam.toggle"
        punishment:
          action: "KICK"
          reason: "&c&lWarning: Please do not use &b&lFreecam &c&lon this server."
          # Optional, only matters when `escalation.enabled` is true.
          # false = this mod ignores the ladder and always applies the action above.
          # escalation: true

      AccurateBlockPlacement:
        detect:
          key: "key.category.accurateblockplacement.category"
        punishment:
          action: "KICK"
          reason: "&c&lWarning: Please do not use &b&lAccurateBlockPlacement &c&lon this server."

      # Example: multiple keybind keys for a single mod.
      # Uncomment and adapt if you know several keys that a mod defines.
      # Xaero:
      #   detect:
      #     keys:
      #       - "key.xaero_open_map"
      #       - "key.xaero_zoom_in"
      #       - "key.xaero_zoom_out"
      #   punishment:
      #     action: "KICK"
      #     reason: "&c&lXaero's Map detected."